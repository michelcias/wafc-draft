# ============================================================
# study.yaml -- what every design of the simulation study shares
# ============================================================
# Read together with one design file (core.yaml, arms.yaml, scale.yaml),
# which may override any entry here: a design's `tuning` and `methods`
# are merged over these, entry by entry. Keys avoid bare `n`, `y`, `yes`,
# `no`, `on`, `off` and `null`, which YAML 1.1 reads as booleans or as a
# missing value; a scenario called "null" is always quoted.
# ------------------------------------------------------------

# The code of the estimator and of its competitors, loaded before any
# fit: the path of its loader, relative to the root of the compendium, or
# "package:<name>" for a package that exports it (see PROVENANCE.md).
code: ../wafc/R/load.R

# The designs run_all.R runs, in order.
designs: [core, arms]

# Single source of randomness. Every seed is derived from `master` by the
# injective encoding of R/seeds.R, from the position of the cell's seed key
# in `keys`, the position of the sample size in `sample_sizes`, the
# replicate and the stream. Both lists are append-only: moving an entry
# changes the data of every replicate after it.
seeds:
  master: 20261006
  keys: [smooth, inhomogeneous, mixed, "null", uneven, scale]
  sample_sizes: [250, 500, 1000, 2000]
  rep_radix: 1000

# The test sample of a replicate, drawn from the same law as the training
# sample, and the grid on which the components are compared.
test_size: 2000
grid_size: 256

# The methods, in the order of the tables. Each one is a fit; `wafc` and
# `lasso` produce two rows each (see R/methods.R and `labels` below).
methods: [wafc, lasso, gam.reml, gam.gcv, bsgl, aspline, klopp, oracle,
          linear, vcbart]

# Arguments passed to the fitter of a method on top of the data, the
# folds and the tuning grids of its sample size.
method_options:
  gam.reml: {k.select: reml, engine: bam}
  gam.gcv:  {k.select: gcv, engine: bam}
  oracle:   {penalty: block}
  vcbart:   {burn: 500, nd: 500, M: 50}

# Tuning, declared per sample size so that a grid can change at one size
# without touching the others. `J` is the grid of resolution levels of the
# methods fitted on the wavelet design (wafc, lasso, klopp, oracle) and the
# grid of dimensions 2^J of bsgl; `k` is the grid of basis dimensions of
# the gam methods; `nfolds` is the number of folds of the partition every
# method of a replicate shares; `basis` is the wavelet basis, evaluated by
# table. A grid can be changed for one method at one size with a `methods`
# entry, for instance
#   "2000":
#     <<: *tuning
#     methods:
#       wafc:     {J: [2, 3, 4, 5, 6, 7, 8, 9]}
#       gam.reml: {k: [5, 10, 20, 40, 80, 120]}
# `nfolds` and `basis` are per sample size only.
tuning:
  "250": &tuning
    nfolds: 10
    J: [2, 3, 4, 5, 6, 7, 8]
    k: [5, 10, 20, 40, 80]
    basis: {family: Daublets, filter_size: 8, prec_wavelet: 30}
  "500": *tuning
  # From n = 1000 the grid of k of gam.reml goes to 240: below that, its
  # choice sits at the top of the grid in the cells with inhomogeneous
  # components. It stops at 240 because one more value would take about
  # an hour per fit in the cell "mixed" at n = 2000. gam.gcv keeps the
  # common grid, since its fits cost several times those of gam.reml at
  # the same k. In every search of k, a value above 80 whose smooths
  # would have more than 2n coefficients (p q k) is not fitted, which in
  # the cell "mixed" (16 smooths) stops the grid at 120 at n = 1000 and in
  # the scale arm (24 smooths) at 80; a REML fit that does not converge
  # within 80 outer iterations of its smoothing parameters, and one
  # that cannot be fitted or scored, are left out too. Every candidate left
  # out is recorded in gam_k.csv with its reason.
  "1000":
    <<: *tuning
    methods:
      gam.reml: {k: [5, 10, 20, 40, 80, 120, 160, 240]}
  # The grids grow with the sample size: at n = 2000, one more resolution
  # level and one more basis dimension, fixed before the study is run.
  "2000":
    <<: *tuning
    J: [2, 3, 4, 5, 6, 7, 8, 9]
    k: [5, 10, 20, 40, 80, 120]
    methods:
      gam.reml: {k: [5, 10, 20, 40, 80, 120, 160, 240]}

# The fitted components kept on the grid, for the figures, by row label
# and sample size. The integrated squared error of every component is kept
# for every row.
curves:
  methods: [wafc.cv1se, gam.reml]
  sample_sizes: [1000]

# Labels the tables print. The row labels are the keys of every table and
# never change.
labels:
  wafc.cv1se:  WAFC
  wafc.cv:     WAFC (cv)
  lasso:       Lasso
  lasso.cv1se: Lasso + threshold
  gam.reml:    GAM (REML)
  gam.gcv:     GAM (GCV)
  bsgl:        B-spline group lasso
  aspline:     Adaptive spline
  klopp:       Block lasso (KP)
  oracle:      Oracle support
  linear:      Constant coefficients
  vcbart:      VCBART

# The row the paired comparisons are read against.
reference: wafc.cv1se

# Parallel workers when the command line does not say (fork; Unix only).
# Results do not depend on it.
workers: 6
