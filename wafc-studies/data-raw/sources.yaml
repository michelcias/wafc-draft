# ============================================================
# sources.yaml -- the source files of the two data applications
# ============================================================
# Each file is downloaded from `url` into <dest>/<dir>/<file> by
# data-raw/fetch.R and checked against `sha256`, the digest of the file
# the data in data/ were built from. A file marked `volatile` is generated
# by its server at each request: a new download may differ in its digest
# without differing in its values, so a mismatch there is a warning, and
# data-raw/prepare.R --check compares the values instead.
# ------------------------------------------------------------

